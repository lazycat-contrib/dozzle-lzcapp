version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: dozzle

build:
  run_buildscript: false

images:
  - id: dozzle
    target: service
    service: dozzle
    source: docker.io/amir20/dozzle
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Dozzle
    summary: 支持 Docker、Swarm 和 Kubernetes 的实时容器日志查看器
